# Layout com fonte de acessibilidade e modo escuro (bugs B33, B34). Antes: 
#   xcrun simctl ui <UDID> content_size accessibility-extra-extra-extra-large && xcrun simctl ui <UDID> appearance dark
# maestro test -e APP_ID=<bundle> -e fonte-grande-e-escuro.yaml   # troque "Início", "Busca" e "Perfil" pelas abas do app
appId: ${APP_ID}
---
- launchApp
- runFlow: login-por-papel.yaml
- repeat:
    times: 3
    commands:
      - tapOn: "Início"
      - takeScreenshot: runs/a11y-inicio
      - tapOn: "Busca"
      - takeScreenshot: runs/a11y-busca
      - tapOn: "Perfil"
      - takeScreenshot: runs/a11y-perfil
- scrollUntilVisible:
    element: "Sair"
    direction: DOWN
# esperado: nada cortado ou sobreposto; botões alcançáveis; comparar prints com magick compare contra a baseline
