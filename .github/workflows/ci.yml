name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Validate skills and marketplace
        run: python scripts/validate_skills.py
      - name: Skills CLI finds every skill
        run: |
          found=$(NO_COLOR=1 npx -y skills@1.7.2 add ./ --list | grep -cE '^│    [a-z0-9-]+$')
          expected=$(ls -d */SKILL.md | wc -l)
          echo "found=$found expected=$expected"
          test "$found" -eq "$expected"
      - name: Script tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q pytest pyyaml
          for tests in */scripts/tests; do
            (cd "$(dirname "$tests")" && python -m pytest tests -q -p no:cacheprovider)
          done
